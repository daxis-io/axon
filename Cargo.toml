[workspace]
members = [
  "crates/contract-proto",
  "crates/browser-engine-worker",
  "crates/browser-sdk",
  "crates/delta-control-plane",
  "crates/delta-runtime-support",
  "crates/native-query-runtime",
  "crates/query-contract",
  "crates/query-router",
  "crates/udf-abi",
  "crates/udf-host-wasi",
  "crates/wasm-http-object-store",
  "crates/wasm-datafusion-planner-poc",
  "crates/wasm-datafusion-poc",
  "crates/wasm-datafusion-session",
  "crates/wasm-parquet-engine",
  "crates/wasm-delta-snapshot",
  "crates/wasm-query-session",
  "crates/wasm-query-runtime",
  "apps/axon-web",
]
exclude = [
  "poc/upstream-wasm-fork-stack",
  "poc/upstream-wasm-fork-stack/fixture-generator",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The shipped browser worker is transfer- and instantiation-sensitive. The
# default speed profile exceeded its 6 MiB Brotli release budget, while the
# measured size profile keeps the complete DataFusion runtime well below it.
opt-level = "z"

# Immutable revision of the revision-pinned Daxis DataFusion/Arrow browser
# stack, including path-free aggregate and sort spill storage.
[patch.crates-io]
datafusion = { git = "https://github.com/daxis-io/datafusion", rev = "8c5b4526a6b31ebec56f32c173f14be74240da49" }
