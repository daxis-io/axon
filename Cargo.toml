[workspace]
members = [
  "crates/contract-proto",
  "crates/browser-engine-worker",
  "crates/browser-sdk",
  "crates/delta-control-plane",
  "crates/delta-runtime-support",
  "crates/native-query-runtime",
  "crates/query-contract",
  "crates/query-router",
  "crates/udf-abi",
  "crates/udf-host-wasi",
  "crates/wasm-http-object-store",
  "crates/wasm-datafusion-planner-poc",
  "crates/wasm-datafusion-poc",
  "crates/wasm-datafusion-session",
  "crates/wasm-parquet-engine",
  "crates/wasm-delta-snapshot",
  "crates/wasm-query-session",
  "crates/wasm-query-runtime",
  "apps/axon-web",
]
exclude = [
  "poc/upstream-wasm-fork-stack",
  "poc/upstream-wasm-fork-stack/fixture-generator",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Browser external-memory execution is implemented in this immutable Daxis
# DataFusion revision. Keep its Arrow and object-store substrate on the exact
# revisions used to build and qualify the fork so the workspace has one type
# universe across Axon, DataFusion, Parquet, and the WASM bridge.
arrow = { git = "https://github.com/daxis-io/arrow-rs", rev = "52c8fb2e9c28b9d89d08c313e1bc938a35c29c99" }
arrow-arith = { git = "https://github.com/daxis-io/arrow-rs", rev = "52c8fb2e9c28b9d89d08c313e1bc938a35c29c99" }
