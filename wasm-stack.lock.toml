schema = 2
target_triple = "wasm32-unknown-unknown"
wasm_roots = ["axon-web-wasm"]

# This lock describes the stack that main's axon-web-wasm closure actually builds: the Daxis
# DataFusion 53.1.0, Arrow/Parquet 58.3.0, and object_store 0.13.2 forks pinned in the root
# Cargo.toml. Delta Kernel and delta-rs are not linked into the WASM closure, so they are declared
# absent. Every mode checks versions, sources, and pinned stack revisions against the locked
# closure. The linked fork revisions have protected release branches. CI enforces the required
# annotated candidate/final source tags; Axon artifact qualification is separate.
# The canonical target stack (DataFusion 55, Arrow 59.3, object_store 0.14.1, Delta Kernel 0.28,
# deltalake-browser) replaces these entries in the change that moves the closure to it.

[release]
branch = "axon-wasm/v1"
candidate_tag = "axon-wasm-v1.0.1-rc.1"
final_tag = "axon-wasm-v1.0.1"

[components.arrow_rs]
canonical_url = "https://github.com/apache/arrow-rs"
daxis_url = "https://github.com/daxis-io/arrow-rs"
release_version = "58.3.0"
base_tag = "58.3.0"
base_sha = "913bab26ba9bed8fc2bc1acda300cc52345b0da1"
candidate_sha = "52c8fb2e9c28b9d89d08c313e1bc938a35c29c99"
stack_sha = "52c8fb2e9c28b9d89d08c313e1bc938a35c29c99"
target_triple = "wasm32-unknown-unknown"
expected_package_source = "https://github.com/daxis-io/arrow-rs"
package_patterns = ["arrow", "arrow-*", "parquet"]

[components.object_store]
canonical_url = "https://github.com/apache/arrow-rs-object-store"
daxis_url = "https://github.com/daxis-io/arrow-rs-object-store"
release_version = "0.13.2"
base_tag = "v0.13.2"
base_sha = "7a65b75b0d26fd8a282999462cb7030fb85fdcc3"
candidate_sha = "73f659ffe91e0798527fc8eadcd36caedcbd6f84"
stack_sha = "73f659ffe91e0798527fc8eadcd36caedcbd6f84"
target_triple = "wasm32-unknown-unknown"
expected_package_source = "https://github.com/daxis-io/arrow-rs-object-store"
package_patterns = ["object_store"]

[components.datafusion]
canonical_url = "https://github.com/apache/datafusion"
daxis_url = "https://github.com/daxis-io/datafusion"
release_version = "53.1.0"
base_tag = "53.1.0"
base_sha = "eae7bf4fa1c037c0a065d1f36d0669f5bb97a9cf"
candidate_sha = "c642f50a86c1cbfaf3d1cc816e742ca4c65b4a45"
stack_sha = "c642f50a86c1cbfaf3d1cc816e742ca4c65b4a45"
target_triple = "wasm32-unknown-unknown"
expected_package_source = "https://github.com/daxis-io/datafusion"
package_patterns = ["datafusion", "datafusion-*"]

[components.delta_kernel]
canonical_url = "https://github.com/delta-io/delta-kernel-rs"
target_triple = "wasm32-unknown-unknown"
wasm_closure = "absent"
package_patterns = ["delta_kernel", "delta_kernel_*", "buoyant_kernel", "buoyant_kernel_*"]

[components.delta_rs]
canonical_url = "https://github.com/delta-io/delta-rs"
target_triple = "wasm32-unknown-unknown"
wasm_closure = "absent"
package_patterns = ["deltalake", "deltalake-*"]
